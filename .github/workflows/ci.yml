name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install pnpm directly under Node 24 (pnpm 11.5.1 needs Node >=22.13,
      # which pnpm/action-setup can't satisfy: it runs under the older Actions
      # runtime Node).
      - run: npm install -g pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm build
