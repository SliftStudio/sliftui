name: Release

# Manual publish of @slift/ui to npm using OIDC trusted publishing, so no npm
# token is stored anywhere. Configure the trusted publisher on npm first:
# package @slift/ui -> Settings -> Trusted Publisher -> GitHub Actions ->
# SliftStudio/sliftui, workflow release.yml. Run from the Actions tab (or
# `gh workflow run release.yml`) after bumping the version and CHANGELOG.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install pnpm directly under Node 24 (pnpm 11.5.1 needs Node >=22.13,
      # which pnpm/action-setup can't satisfy: it runs under the older Actions
      # runtime Node).
      - run: npm install -g pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      # Build the publishable dist/ (svelte-package + publint) so the publish
      # step can skip lifecycle scripts and just upload the result.
      - run: pnpm run prepack
      # OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # No --provenance: it requires a public source repo, and this repo is
      # private. OIDC trusted publishing still authenticates without a token.
      - name: Publish @slift/ui
        run: npm publish --access public --ignore-scripts
