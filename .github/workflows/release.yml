name: Release

# Manual publish of @slift/ui to npm using OIDC trusted publishing, so no npm
# token is stored anywhere. Configure the trusted publisher on npm first:
# package @slift/ui -> Settings -> Trusted Publisher -> GitHub Actions ->
# SliftStudio/sliftui, workflow release.yml. Run this from the Actions tab (or
# `gh workflow run release.yml`) after bumping the version and CHANGELOG.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Build the publishable dist/ (svelte-package + publint) up front so the
      # publish step can skip lifecycle scripts and just upload the result.
      - run: pnpm run prepack
      - name: Publish @slift/ui
        run: npm publish --provenance --access public --ignore-scripts
