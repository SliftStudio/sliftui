name: Release

# Manual publish to npm with provenance. Run this from the Actions tab after
# bumping versions. Requires an NPM_TOKEN secret (a granular automation token
# with publish access to the @slift scope and the slift / sliftui packages).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Publish library first (sliftui depends on it), then the CLI, then the alias.
      - name: Publish @slift/ui
        run: pnpm --filter @slift/ui publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish slift (CLI)
        run: pnpm --filter slift publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sliftui (alias)
        run: pnpm --filter sliftui publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
